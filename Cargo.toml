[workspace]
resolver = "2"
members = [
    ".",
    "crates/post-cortex-proto",
    "crates/post-cortex-core",
    "crates/post-cortex-mcp",
    "crates/post-cortex-daemon",
    "crates/post-cortex",
]

# Default `cargo` operations run against the legacy root crate so the existing
# build / test / bench flows keep working while we migrate content into the
# crates/* members. After Phase 8 the root [package] is deleted and the facade
# crate becomes the default.
default-members = ["."]

[workspace.package]
version = "0.1.23"
edition = "2024"
authors = ["Julius ML"]
license = "MIT"
repository = "https://github.com/juliusbiascan/post-cortex"
rust-version = "1.85"

# Shared deps pinned once. Member crates opt in via `dep.workspace = true`.
# `optional`, `features`, and `default-features` overrides stay per-consumer.
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
bincode = { version = "2.0.1", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.42", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
rocksdb = "0.24"
futures = "0.3"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.0"
dashmap = "6.1"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
arc-swap = "1.7"
atomic_float = "1.1"
parking_lot = "0.12"
log = "0.4"
num_cpus = "1.16"
rayon = "1.10"
rand = "0.9.2"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
petgraph = { version = "0.8.2", features = ["serde-1"] }
async-trait = "0.1"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
tokenizers = "0.22"
hf-hub = "0.4"
surrealdb = { version = "3.0.0", features = ["kv-mem", "protocol-ws"] }
surrealdb-types = "3.0.0"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1.5"
dirs = "6.0.0"
reqwest = { version = "0.12", features = ["json"] }
dialoguer = "0.11"
toml = "0.9.10"
flate2 = "1.0"
zstd = "0.13"
rmcp = { version = "0.12.0", features = ["server", "transport-streamable-http-server"] }
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# Observability — added Phase 10; lifted here now so versions stay in lock-step
# across crates when the otel feature lands.
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.28"

# Dev / test helpers
tokio-test = "0.4"
tempfile = "3.0"
criterion = "0.8.1"
portpicker = "0.1"
proptest = "1.5"
serial_test = { version = "3.3", features = ["async"] }

# Intra-workspace path deps. Versions match [workspace.package].version so a
# `cargo publish` from any member resolves siblings on crates.io rather than
# the local path.
post-cortex-proto = { version = "0.1.23", path = "crates/post-cortex-proto" }
post-cortex-core = { version = "0.1.23", path = "crates/post-cortex-core" }
post-cortex-mcp = { version = "0.1.23", path = "crates/post-cortex-mcp" }
post-cortex-daemon = { version = "0.1.23", path = "crates/post-cortex-daemon" }

[profile.release]
# Surface real bugs hard instead of unwinding through tokio task boundaries.
panic = "abort"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true   # so flamegraph / pprof can resolve symbols

# ---------------------------------------------------------------------------
# Legacy root crate (single-crate post-cortex 0.1.23). Stays in place until
# Phase 8 deletes it in favour of the facade crate.
# ---------------------------------------------------------------------------
[package]
name = "post-cortex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "An intelligent conversation memory system for AI assistants that provides persistent knowledge storage, semantic search, and automatic relationship mapping with lock-free concurrency guarantees"
keywords = ["conversation", "memory", "semantic-search", "lock-free", "mcp"]
categories = ["data-structures", "database-implementations", "concurrency"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
bincode.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rocksdb.workspace = true
futures.workspace = true
thiserror.workspace = true
clap.workspace = true
regex.workspace = true
dashmap.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
arc-swap.workspace = true
atomic_float.workspace = true
parking_lot.workspace = true
log.workspace = true
num_cpus.workspace = true
rayon.workspace = true
rand.workspace = true
env_logger.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
petgraph.workspace = true
async-trait.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
surrealdb = { workspace = true, optional = true }
surrealdb-types = { workspace = true, optional = true }
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
dirs.workspace = true
reqwest.workspace = true
dialoguer.workspace = true
toml.workspace = true
flate2.workspace = true
zstd.workspace = true
rmcp.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true

# Phase 2 — gRPC types now live in a sibling crate. The legacy root keeps
# `crate::daemon::grpc_service::pb` working via a re-export inside
# src/daemon/grpc_service/mod.rs, but all 30+ call sites that used to be
# under `core/` and `storage/` now import `post_cortex_proto::pb::…`
# directly so the upcoming Phase 3 core extraction is unblocked.
post-cortex-proto.workspace = true

# Phase 3 — domain modules now live in post-cortex-core. The legacy root
# re-exports them via src/lib.rs so `crate::core::X` paths inside
# src/daemon/ and src/tools/ keep resolving until Phases 6/7 finish the
# split.
post-cortex-core = { workspace = true }

# [build-dependencies] section intentionally absent — the legacy root no
# longer compiles proto. tonic-build moved to crates/post-cortex-proto.

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
criterion.workspace = true
portpicker.workspace = true
proptest.workspace = true
serial_test.workspace = true
tokio-stream.workspace = true

[[bin]]
name = "pcx"
path = "src/bin/pcx.rs"

[[bench]]
name = "query_cache_bench"
harness = false

[features]
default = ["embeddings"]
llm-integration = []
embeddings = ["candle-core", "candle-nn", "candle-transformers", "tokenizers", "hf-hub"]
surrealdb-storage = ["dep:surrealdb", "dep:surrealdb-types"]
surrealdb-tikv = ["dep:surrealdb", "surrealdb/kv-tikv"]
