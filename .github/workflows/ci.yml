name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # -------------------------------------------------------------------------
  # Format
  # -------------------------------------------------------------------------
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # -------------------------------------------------------------------------
  # File size — no Rust file over 500 lines outside the allowlist of files a
  # later migration wave splits (docs/ARCHITECTURE.md rule 6).
  # -------------------------------------------------------------------------
  file-size:
    name: file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-file-size.sh

  # -------------------------------------------------------------------------
  # Architecture — the rules of docs/ARCHITECTURE.md section 2 a grep can see
  # (module paths, pure domain, env reads, adapters chosen by the daemon);
  # each count may only go down to 0.
  # -------------------------------------------------------------------------
  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/check-architecture.sh
      - run: scripts/check-architecture.sh --new "$(git merge-base HEAD origin/main)"

  # -------------------------------------------------------------------------
  # Clippy — workspace-wide, all targets, all features. Treats warnings as
  # errors so the strict lint suite stays clean.
  # -------------------------------------------------------------------------
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # -------------------------------------------------------------------------
  # Build + test matrix. Three configurations:
  #   1. default features          — confirms the headline path works
  #   2. --no-default-features     — confirms nothing relies on default features
  #   3. --features all            — confirms feature combinations compile
  # -------------------------------------------------------------------------
  test:
    name: cargo test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            flags: ""
          - features: no-default
            flags: --no-default-features
          - features: all
            flags: --all-features
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The local reranker's conformance and ranking tests (feature `rerank`)
      # run the smallest cross-encoder (~25 MB, downloaded once, then cached)
      # on the ONNX Runtime release the README names.
      - name: Cache the reranker model
        if: matrix.features == 'all'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-cross-encoder-ms-marco-MiniLM-L4-v2
      # Microsoft's NuGet package of the release, checked by its SHA-256: the
      # GitHub repository of ONNX Runtime and its release downloads answer 404
      # since 2026-11-17.
      - name: Install ONNX Runtime
        if: matrix.features == 'all'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ort.nupkg" \
            https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.32.0/microsoft.ml.onnxruntime.1.32.0.nupkg
          echo "a9150bc2992cbbb6722070da9910e1ffa989a8bfc67bdd5bb8e745ca755641db  $RUNNER_TEMP/ort.nupkg" | sha256sum -c -
          unzip -j -d "$RUNNER_TEMP/onnxruntime" "$RUNNER_TEMP/ort.nupkg" runtimes/linux-x64/native/libonnxruntime.so
          echo "ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime/libonnxruntime.so" >> "$GITHUB_ENV"
      - run: cargo build --workspace ${{ matrix.flags }}
      - run: cargo test --workspace --lib ${{ matrix.flags }}
        # Lib tests only. Integration tests under crates/post-cortex/tests/
        # require a real SurrealDB endpoint + outbound network for HF Hub
        # model downloads + dedicated ports, none of which are available in
        # the hosted CI runners. They live in the suite to be runnable
        # locally / from a self-hosted runner — see
        # `crates/post-cortex/tests/it/integration_e2e_surrealdb.rs` for the
        # canonical example and its `POST_CORTEX_E2E_SURREAL_*` env vars.

  # -------------------------------------------------------------------------
  # Doctest sweep — every doctest in every crate must compile + run.
  # -------------------------------------------------------------------------
  doctest:
    name: cargo test --doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --workspace --doc --all-features

  # -------------------------------------------------------------------------
  # Documentation — must build cleanly: any rustdoc warning fails the job
  # (owner 2026-11-17).
  # -------------------------------------------------------------------------
  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # -------------------------------------------------------------------------
  # Supply-chain checks — cargo-audit (vulnerabilities) + cargo-deny
  # (license / multiple-versions / source whitelist).
  # -------------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # As scripts/cargo.sh audit: every advisory and warning fails, but those
      # .cargo/audit.toml names with its reason.
      - run: cargo audit --deny warnings

  # -------------------------------------------------------------------------
  # Every dependency at its latest release (CLAUDE.md, LAW: every dependency
  # at its latest version): Cargo.lock, the npm and uv lock files and the
  # actions of these workflows (scripts/check_deps.py).
  # -------------------------------------------------------------------------
  deps:
    name: dependencies at their latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/check-deps.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features

  # -------------------------------------------------------------------------
  # MSRV enforcement — declared as rust-version = "1.85" in
  # [workspace.package]. cargo-msrv verifies the workspace compiles on
  # exactly that toolchain.
  # -------------------------------------------------------------------------
  msrv:
    name: cargo msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace --all-features

  # -------------------------------------------------------------------------
  # Coverage — cargo-llvm-cov on the lib-test surface; uploaded to
  # Codecov for trend tracking. Integration tests deliberately excluded
  # (they bind ports / start daemons and would skew coverage numbers).
  # -------------------------------------------------------------------------
  coverage:
    name: cargo llvm-cov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --lib --features surrealdb-storage --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false  # coverage upload is informational

  # -------------------------------------------------------------------------
  # SDKs: generated gRPC code matches pcx.proto, and both clients pass their
  # end-to-end tests against a freshly built daemon.
  # -------------------------------------------------------------------------
  sdk:
    name: SDKs (Python, TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build -p post-cortex-daemon --bin pcx
      - name: Generated code is up to date
        run: sdks/gen.sh && git diff --exit-code -- sdks
      - name: Python SDK
        working-directory: sdks/python
        run: uv run mypy && uv run pytest -q
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: npm ci && npm run typecheck && npm test

  # -------------------------------------------------------------------------
  # Catalog packages (Claude Code plugin, Cursor plugin, Gemini CLI
  # extension, MCP Registry entry): every copied or generated file matches
  # the pcx templates and the workspace version it comes from.
  # -------------------------------------------------------------------------
  integrations:
    name: Catalog packages in sync, hook resolver and launcher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 integrations/sync.py --check
      - run: python3 -m py_compile integrations/sync.py integrations/claude-code/hooks/*.py
      - run: sh -n integrations/cursor/scripts/pcx.sh
      # The project resolver (pcx_resolve.py) against the shared test vectors
      # in integrations/testdata, and the hooks run as Claude Code runs them.
      - run: python3 -m unittest discover -s integrations/tests -v
      # The pcx launcher of the Cursor plugin and the Gemini CLI extension,
      # and the manifests that call it.
      - run: python3 -m unittest discover -s integrations/cursor/tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Gemini CLI validates the extension
        run: npx -y @google/gemini-cli@0.68.0 extensions validate integrations/gemini
      - name: mcp-publisher validates the registry entries
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" mcp-publisher
          for f in server.json server.self-hosted.json; do
            "$RUNNER_TEMP/mcp-publisher" validate "integrations/mcp-registry/$f"
          done

  # -------------------------------------------------------------------------
  # Native plugins (integrations/js): the shared core and the OpenCode, Kilo,
  # Pi, OpenClaw and DeepSeek Harness plugins build, type-check against each
  # client's published plugin types and pass their tests. Install scripts are
  # off: only type packages and test helpers are installed.
  # -------------------------------------------------------------------------
  plugins-js:
    name: Native plugins (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integrations/js/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test

  # -------------------------------------------------------------------------
  # Workspace publish dry-run. Runs on every tag push to verify that
  # `cargo workspaces publish` would succeed in topological order before
  # the actual release job consumes the tag.
  # -------------------------------------------------------------------------
  publish-dry-run:
    name: cargo workspaces publish --dry-run
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-workspaces
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-workspaces
      - run: cargo workspaces publish --from-git --dry-run --yes
