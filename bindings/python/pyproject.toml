[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pcx-module"
description = "A pcx module in Python, on the Rust core of pcx."
requires-python = ">=3.15"
license = "MIT"
dependencies = ["protobuf>=6"]
dynamic = ["version"]

[tool.maturin]
# The extension, under the package's Python layer.
module-name = "pcx_module._core"
python-source = "python"
features = []
