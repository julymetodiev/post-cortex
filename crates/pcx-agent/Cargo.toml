[package]
name = "pcx-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The pcx agent: turns with models and tools, its transcript kept in memory, its events to the modules that answer them."
keywords = ["pcx", "agent", "llm", "tools"]
categories = ["development-tools"]
documentation = "https://docs.rs/pcx-agent"

[[bin]]
name = "pcx-agent"
path = "src/main.rs"

[dependencies]
pcx-module-api.workspace = true
# Memory's messages, the transcript, over the host channel (W23).
post-cortex-proto.workspace = true
tonic.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio-util.workspace = true

[lints]
workspace = true
