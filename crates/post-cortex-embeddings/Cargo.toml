[package]
name = "post-cortex-embeddings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embedding engines (Model2Vec static + BERT via Candle + static-hash fallback) and HNSW vector database for post-cortex. Self-contained ML stack — depend on this crate when you need vector search without the full post-cortex orchestrator."
keywords = ["embeddings", "vector-search", "hnsw", "model2vec", "bert"]
categories = ["algorithms", "data-structures", "science"]
readme = "README.md"
documentation = "https://docs.rs/post-cortex-embeddings"

[dependencies]
# Self-contained crate — no post-cortex-core dependency. The shared types
# (VectorMetadata, SearchMatch, VectorDbStats…) live here in
# `crate::vector_db::types`; storage and other crates that only need
# round-trip access can depend on this crate with
# `default-features = false` to skip the candle/HNSW build.

# Async + serialisation
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
bincode.workspace = true

# Concurrency primitives — lock-free where possible
dashmap.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
rayon.workspace = true
num_cpus.workspace = true
rand.workspace = true
crossbeam-queue.workspace = true
log.workspace = true

# ML stack — feature-gated so consumers that only want HNSW + static-hash
# don't pull candle. Default-on for parity with the legacy crate's
# default feature set.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# Static embeddings (Model2Vec — multilingual, lightweight, ms-per-text
# inference, no GPU). Enabled via the `model2vec` feature.
model2vec-rs = { workspace = true, optional = true }

tracing.workspace = true


# ONNX Runtime for `rerank`. On Linux it is loaded at run time from
# `libonnxruntime.so` (`ORT_DYLIB_PATH`): the static build `ort` downloads
# needs glibc >= 2.38, which rules out Ubuntu 22.04 and Debian 12. Microsoft's
# release `.so` runs on glibc >= 2.28. Elsewhere it is linked statically.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, optional = true, features = ["std", "tracing", "load-dynamic", "api-31"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ort = { workspace = true, optional = true, features = ["std", "tracing", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
proptest.workspace = true

[features]
default = ["model2vec"]
bert = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
# Int8 cross-encoder reranker on ONNX Runtime (`rerank::OnnxCrossEncoder`).
# Linux loads `libonnxruntime.so` at run time; elsewhere `ort` links a
# prebuilt ONNX Runtime downloaded at build time.
rerank = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]
# Voyage AI rerank API (`rerank::VoyageReranker`).
rerank-voyage = ["dep:reqwest"]
# Static Model2Vec embeddings (potion-multilingual-128M et al.). Default
# because it's smaller, faster, and multilingual out of the box; the
# heavier BERT stack stays opt-in for users who need transformer-grade
# semantic search.
model2vec = ["dep:model2vec-rs"]
# Phase 10 placeholder.
otel = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
