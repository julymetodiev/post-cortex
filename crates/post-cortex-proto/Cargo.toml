[package]
name = "post-cortex-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Protobuf + tonic-generated wire types for post-cortex. Domain-neutral; safe to depend on from gRPC clients without pulling the full server stack."
keywords = ["post-cortex", "grpc", "protobuf", "tonic", "memory"]
categories = ["api-bindings", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/post-cortex-proto"

[dependencies]
prost.workspace = true
prost-types.workspace = true
# Full tonic features (transport, codegen, etc.) so the generated server +
# client traits are usable. Downstream consumers that only need message
# types still pay no extra cost — tonic's `prost` feature is the
# critical one, and the transport modules compile away when unused.
tonic.workspace = true

[build-dependencies]
tonic-build.workspace = true
