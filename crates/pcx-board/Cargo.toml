[package]
name = "pcx-board"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The pcx board module: boards, tasks, their discussion and decisions, kept as documents in memory."
keywords = ["pcx", "board", "tasks", "agents"]
categories = ["development-tools"]
documentation = "https://docs.rs/pcx-board"

[[bin]]
name = "pcx-board"
