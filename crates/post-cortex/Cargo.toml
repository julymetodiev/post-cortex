[package]
name = "post-cortex"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Intelligent conversation memory system for AI assistants — persistent knowledge storage, semantic search, knowledge graph, MCP + gRPC transports. Facade crate re-exporting the post-cortex workspace stack."
keywords = ["conversation", "memory", "semantic-search", "mcp", "ai"]
categories = ["data-structures", "database-implementations"]
readme = "README.md"
documentation = "https://docs.rs/post-cortex"

[dependencies]
# The facade re-exports every member crate so end-to-end consumers get
# one dependency line and the full stack.
post-cortex-proto.workspace = true
post-cortex-core.workspace = true
post-cortex-ports.workspace = true
post-cortex-embeddings.workspace = true
post-cortex-storage.workspace = true
post-cortex-memory.workspace = true
post-cortex-transport.workspace = true
post-cortex-daemon.workspace = true

[dev-dependencies]
# The integration tests under tests/ drive the memory system, the MCP
# transport and the vector DB through this facade.
post-cortex-memory.workspace = true
anyhow.workspace = true
tokio.workspace = true
tempfile.workspace = true
serial_test.workspace = true
proptest.workspace = true
criterion.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "query_cache_bench"
harness = false

[features]
default = []
surrealdb-storage = ["post-cortex-daemon/surrealdb-storage"]
# Opt-in BERT embedding backend; default builds use model2vec only.
bert = ["post-cortex-daemon/bert"]
rerank = ["post-cortex-daemon/rerank"]
rerank-voyage = ["post-cortex-daemon/rerank-voyage"]
surrealdb-tikv = ["surrealdb-storage", "post-cortex-storage/surrealdb-tikv"]
otel = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
