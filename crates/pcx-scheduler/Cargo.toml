[package]
name = "pcx-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The pcx scheduler module: jobs at cron times or intervals that run a script under the sandbox or add a board task, and their runs, kept as documents in memory."
keywords = ["pcx", "scheduler", "cron", "jobs"]
categories = ["development-tools"]
documentation = "https://docs.rs/pcx-scheduler"

[[bin]]
name = "pcx-scheduler"
path = "src/main.rs"

[dependencies]
pcx-module-api.workspace = true
pcx-documents.workspace = true
# Its package, pcx.scheduler.v1, and the board's it calls.
post-cortex-proto.workspace = true
prost.workspace = true
prost-types.workspace = true
tonic.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true

[dev-dependencies]
# The runner's first look: a channel that counts its calls (tests only).
tower = { workspace = true, features = ["util"] }
# `start_paused`, so the test moves the runner's interval.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
