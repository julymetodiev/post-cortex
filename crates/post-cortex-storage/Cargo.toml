[package]
name = "post-cortex-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Storage backends for post-cortex — RocksDB (default) and optional SurrealDB, behind one storage port per capability, plus the pcx export archive."
keywords = ["post-cortex", "storage", "rocksdb", "surrealdb", "kv"]
categories = ["database-implementations"]
readme = "README.md"
documentation = "https://docs.rs/post-cortex-storage"

[dependencies]
# Domain types (session, graph, workspace, context_update, scoring,
# structured_context, error) come from post-cortex-core.
post-cortex-core.workspace = true

# The ports these adapters implement and the types they speak.
post-cortex-ports.workspace = true

# Reads the protobuf source-reference rows of 0.5.0 (a frozen copy of
# that schema) during the one-time RocksDB migration; the freshness port
# and the stored rows use domain types and the backends' own layouts.
prost.workspace = true

# Storage engines
rocksdb.workspace = true
surrealdb = { workspace = true, optional = true }
surrealdb-types = { workspace = true, optional = true }

# Async + serialisation
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
futures.workspace = true
regex.workspace = true

# Concurrency primitives
dashmap.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
tokio.workspace = true

# Compression for export/import
flate2.workspace = true
zstd.workspace = true

# Observability
log.workspace = true
tracing.workspace = true

[dev-dependencies]
# `ExportData`, a whole archive in memory, to build and inspect archives.
post-cortex-core = { workspace = true, features = ["test-support"] }
# The shared port conformance suites, run against each adapter.
post-cortex-ports = { workspace = true, features = ["conformance"] }
tokio.workspace = true
tempfile.workspace = true
serial_test.workspace = true
tokio-test.workspace = true

[features]
# rocksdb is the default backend — always compiled. Feature naming kept
# in sync with the legacy single-crate package so existing `#[cfg(feature
# = "surrealdb-storage")]` annotations across the moved tree (~60 sites)
# resolve without rewriting.
default = []
surrealdb-storage = ["dep:surrealdb", "dep:surrealdb-types"]
otel = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
