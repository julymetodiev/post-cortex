[package]
name = "post-cortex-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core domain library for post-cortex: lock-free conversation memory, semantic search, knowledge graph, and storage backends. Transport-agnostic — no axum/tonic/rmcp."
keywords = ["conversation", "memory", "semantic-search", "lock-free", "knowledge-graph"]
categories = ["data-structures", "database-implementations", "concurrency"]
readme = "README.md"
documentation = "https://docs.rs/post-cortex-core"

[dependencies]
post-cortex-proto.workspace = true

# Direct prost (needed by storage/rocksdb_storage/freshness.rs for
# encoding SourceReference proto messages into RocksDB).
prost.workspace = true

# Filesystem helpers (StorageConfig default path lookup).
dirs.workspace = true

# Core async runtime + serialisation
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
bincode.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
thiserror.workspace = true
async-trait.workspace = true
regex.workspace = true

# Lock-free + concurrency primitives
dashmap.workspace = true
crossbeam-channel.workspace = true
crossbeam-queue.workspace = true
arc-swap.workspace = true
atomic_float.workspace = true
parking_lot.workspace = true
rayon.workspace = true
num_cpus.workspace = true
rand.workspace = true

# Domain
petgraph.workspace = true

# Storage backends
rocksdb.workspace = true
surrealdb = { workspace = true, optional = true }
surrealdb-types = { workspace = true, optional = true }

# Export / import compression (storage::export_import)
flate2.workspace = true
zstd.workspace = true

# Local embeddings (Phase 1+: feature-gated)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }

# Observability
log.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio-test.workspace = true
tempfile.workspace = true
criterion.workspace = true
proptest.workspace = true
serial_test.workspace = true
tokio-stream.workspace = true

[features]
default = ["embeddings"]
embeddings = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:hf-hub",
]
surrealdb-storage = ["dep:surrealdb", "dep:surrealdb-types"]
surrealdb-tikv = ["dep:surrealdb", "surrealdb/kv-tikv"]
# Placeholder for Phase 10 — the otel feature toggles between no-op tracing
# layers and the full OTLP exporter stack. Wired with deps in Phase 10.
otel = []
