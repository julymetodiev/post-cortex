[package]
name = "post-cortex-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core domain library for post-cortex: conversation records, entities and the knowledge graph, sessions, workspaces, summaries and the service trait. No storage, search or transport."
keywords = ["conversation", "memory", "knowledge-graph", "ai", "mcp"]
categories = ["data-structures"]
readme = "README.md"
documentation = "https://docs.rs/post-cortex-core"

[dependencies]
# post-cortex-core is the dependency root: pure domain, no wire schema,
# no runtime (ARCHITECTURE rule 1). Only lightweight stdlib-adjacent crates.
# Serialisation and errors
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
schemars.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
regex.workspace = true
base64.workspace = true


# Domain
rpds.workspace = true
rust-stemmers.workspace = true
# A blob's media type and size by its first bytes (no IO).
imagesize.workspace = true

# Observability
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "write_path"
harness = false

[features]
default = []
# Placeholder for Phase 10 — the otel feature toggles between no-op tracing
# layers and the full OTLP exporter stack. Wired with deps in Phase 10.
otel = []
# `ExportData`: a whole archive in memory, for other crates' tests.
test-support = []

[lints]
workspace = true
