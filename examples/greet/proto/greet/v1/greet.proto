// The greet example on the bindings (docs/modules/dynamic.md): the same
// module in Python (python/module.py) and in TypeScript (ts/module.ts).
syntax = "proto3";
package example.greet.v1;

service Greeter {
  // Says hello to someone.
  rpc Greet(GreetRequest) returns (GreetResponse);
}

// Whom to greet.
message GreetRequest {
  // Who to greet.
  string name = 1;
}

// The greeting.
message GreetResponse {
  // What it said.
  string text = 1;
}
