# cargo-audit configuration (scripts/cargo.sh audit and CI's cargo audit, both
# with --deny warnings). Mirrors the advisory ignore list in `deny.toml`'s
# `[advisories]` section; keep both in sync.
#
# Each entry names the advisory, where it comes from, and why it stays: no
# release of the crate (or of what pulls it in) fixes it. The list was
# rebuilt on 2026-11-17 from what cargo audit finds without it, after
# surrealdb 4.0.1 and the removal of the embedded TiKV client.

[advisories]
ignore = [
    # rsa Marvin attack: no fixed release of rsa. Pulled by jsonwebtoken of
    # surrealdb-core 4.0.1 (SurrealDB's JWT auth, which post-cortex does not
    # expose). Documented as accepted risk in SECURITY.md.
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5 timing: fixed only in 0.7; p256/p384 of jsonwebtoken
    # 10.4 (surrealdb 4.0.1) pin 0.5.
    "RUSTSEC-2026-0387",
    # heapless 0.8.0, 0.7.17, 0.6.1: nine advisories of 2026-11-18, fixed only in
    # 0.9.4. The compiled copy 0.8.0 comes through rstar 0.12.2, which geo 0.32
    # (surrealdb-idx and surrealdb-expr 4.0.1) requires; no geo release takes
    # rstar 0.14, the first on heapless 0.9. rstar uses only heapless's
    # BinaryHeap, which none of them names. 0.7.17 and 0.6.1 are optional rstar
    # versions of geo-types and are not compiled. Documented in SECURITY.md.
    "RUSTSEC-2026-0574", # FindMutView::pop use after free
    "RUSTSEC-2026-0575", # Spsc::peek ordering
    "RUSTSEC-2026-0576", # IndexMap::truncate
    "RUSTSEC-2026-0577", # panicking Drop (Deque, HistoryBuf, IndexMap, vec::IntoIter)
    "RUSTSEC-2026-0578", # SortedLinkedList::zeroize
    "RUSTSEC-2026-0579", # Deque from TryFrom when full
    "RUSTSEC-2026-0580", # treiber stack race
    "RUSTSEC-2026-0581", # Deque::make_contiguous
    "RUSTSEC-2026-0582", # IndexMap::insert at u16::MAX elements

    # Unmaintained crates: informational, not vulnerabilities.
    "RUSTSEC-2023-0089", # atomic-polyfill, a target-specific transitive with no replacement release
    "RUSTSEC-2025-0141", # bincode 2.0.1: 3.0.0 is only a compile_error! (scripts/deps-exceptions.txt)
    "RUSTSEC-2025-0119", # number_prefix, via indicatif of tokenizers 0.21 of model2vec-rs 0.4
    "RUSTSEC-2024-0436", # paste, via gemm of candle-core 0.11

    # chrono is declared unmaintained (2026-11; chronotope/chrono#1768) with no
    # successor release; it is the time type of the whole workspace and of
    # surrealdb, cel-core and object_store. Moving to jiff or time is its own
    # task (owner 2026-11-17: ignore now).
    "RUSTSEC-2026-0543", # chrono unmaintained
    "RUSTSEC-2026-0555", # chrono-tz unmaintained (transitive via cel-core)
    "RUSTSEC-2026-0542", # humantime unmaintained, wraps chrono (transitive via object_store)
]
