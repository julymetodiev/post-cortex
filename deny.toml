# cargo-deny configuration. Wired into CI in Phase 13.
# Doc: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RUSTSEC vulnerabilities
# ---------------------------------------------------------------------------
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# Baseline ignores (Phase 0 — see docs/audit-baseline-0.1.23.md). All findings
# below come from `surrealdb 3.0.0` transitive dependencies. Re-evaluate when
# surrealdb releases a 3.x update with fresher pinned dependencies.
ignore = [
    "RUSTSEC-2026-0045", # aws-lc-sys AES-CCM timing
    "RUSTSEC-2026-0044", # aws-lc-sys X.509 name constraints bypass
    "RUSTSEC-2026-0048", # aws-lc-sys CRL scope check
    "RUSTSEC-2026-0047", # aws-lc-sys PKCS7_verify bypass A
    "RUSTSEC-2026-0046", # aws-lc-sys PKCS7_verify bypass B
    "RUSTSEC-2026-0037", # quinn-proto DoS on endpoints
    "RUSTSEC-2023-0071", # rsa Marvin attack (no upstream fix — see SECURITY.md)
    "RUSTSEC-2026-0104", # rustls-webpki CRL parse panic
    "RUSTSEC-2026-0098", # rustls-webpki URI name constraints
    "RUSTSEC-2026-0099", # rustls-webpki wildcard name constraints
    "RUSTSEC-2026-0049", # rustls-webpki
    "RUSTSEC-2026-0009", # time
    "RUSTSEC-2023-0089", # atomic-polyfill unmaintained
    "RUSTSEC-2025-0141", # bincode 2.0.1 unmaintained
    "RUSTSEC-2025-0119", # number_prefix unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained (transitive via candle / surrealdb)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (transitive via reqwest 0.13)
    # quick-xml 0.39 via surrealdb-core -> object_store (S3/GCS backends we
    # never configure); surrealdb 3.3.4 pins it. Re-check on the next surrealdb.
    "RUSTSEC-2026-0195", # quick-xml NsReader namespace allocation
    "RUSTSEC-2026-0194", # quick-xml duplicate-attribute quadratic check
    # zip 7.4 via candle-core, only with the opt-in `bert` feature; affects
    # archive extraction, which candle/post-cortex never call.
    "RUSTSEC-2026-0367", # zip SUID/SGID bits on extract
    "RUSTSEC-2026-0368", # zip symlink targets outside destination
    "RUSTSEC-2026-0369", # zip permissions applied through symlinks
]

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    # `Unlicense` is a public-domain dedication used by some Rust crates
    # (e.g. `ext-sort`). OSI-approved and equivalent to CC0 for our purposes.
    "Unlicense",
    # `CDLA-Permissive-2.0` is the Linux Foundation's permissive data license
    # used by `webpki-roots` for the bundled CA certificate set.
    "CDLA-Permissive-2.0",
]
# Crates with non-SPDX or unusual license files. Reviewed and accepted.
#
# `surrealdb` family ships under the Business Source License 1.1 (BUSL-1.1).
# BUSL is "source available, not OSI-approved" — it forbids competing
# commercial database services but is fine for embedded / library use.
# SurrealDB transitions each release to Apache-2.0 four years after publish.
# post-cortex pulls SurrealDB only through the optional `surrealdb-storage`
# feature, so downstream consumers opt in explicitly.
exceptions = [
    { name = "surrealdb",              version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-core",         version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-types",        version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-types-derive", version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-protocol",     version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-catalog",      version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-cnf",          version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-collections",  version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-common",       version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-datastore",    version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-engine-api",   version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-engine-local", version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-expr",         version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-iam",          version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-idx",          version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-keyspace-macro", version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-kvs",          version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-kvs-any",      version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-kvs-mem",      version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-kvs-tikv",     version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-observe",      version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-parse-common", version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-rpc",          version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-runtime",      version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-sql",          version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-strand",       version = "*", allow = ["BUSL-1.1"] },
    { name = "surrealdb-syn",          version = "*", allow = ["BUSL-1.1"] },
]

# `surrealdb` declares `license = "non-standard"` and ships the BUSL-1.1
# LICENSE file. The text matches the BUSL-1.1 template at confidence 0.87,
# just below the global threshold of 0.93 — clarifying the expression here
# bypasses the threshold without weakening it for other crates.
[[licenses.clarify]]
name = "surrealdb"
version = "*"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[[licenses.clarify]]
name = "surrealdb-core"
version = "*"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[[licenses.clarify]]
name = "surrealdb-types"
version = "*"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

[[licenses.clarify]]
name = "surrealdb-types-derive"
version = "*"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0xbb1191d7 }]

# SurrealDB 3.3 split the engine into sub-crates that ship the same BUSL-1.1
