# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Steer the workspace toward rustls; ban openssl-sys to keep the build
# reproducible and free of system-OpenSSL surprises. SurrealDB 3.0.5
# transitively brings openssl back via `surrealdb-tikv-client` and
# `surrealdb-protocol`, so the ban is recorded as a warning rather than
# a hard deny while the `surrealdb-storage` feature is opt-in. The
# rustls-by-default policy for the rest of the workspace stands.
# TODO(0.4.0): investigate disabling SurrealDB's openssl-pulling
# features (`kv-tikv`, TLS protocol arms) — see SECURITY.md.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
